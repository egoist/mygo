# Temporary: regenerates the compiled Metal and Direct3D shaders of the
# branch named in .github/shadergen-ref on macOS and Windows runners, and
# uploads them as artifacts, for PRs whose shaders change.
name: shadergen
on:
  push:
    branches: [claude/shadergen-1862]
permissions:
  contents: read
jobs:
  gen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: metal, pkgs: "./internal/gpu/metal ./plugins/glass" }
          - { os: windows-latest, name: d3d11, pkgs: "./internal/gpu/d3d11 ./plugins/glass" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: gen }
      - id: ref
        shell: bash
        run: echo "ref=$(cat gen/.github/shadergen-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { path: src, ref: "${{ steps.ref.outputs.ref }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: src/go.mod, cache-dependency-path: src/go.sum }
      - name: generate
        shell: bash
        working-directory: src
        run: |
          git log -1 --format='%H %s'
          go generate ${{ matrix.pkgs }}
          git diff --stat
          go test ${{ matrix.pkgs }} -run 'Shader|Bytecode|Library'
          mkdir -p ../out
          git diff --name-only | while read -r f; do mkdir -p "../out/$(dirname "$f")"; cp "$f" "../out/$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out
