name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth dbus-x11
      - run: bun install --frozen-lockfile
      - name: Build the JavaScript packages
        run: bun run build
      - name: Build and vet every platform
        if: runner.os == 'Linux'
        run: |
          for os in darwin linux windows; do
            GOOS=$os go build ./...
            GOOS=$os go vet ./...
          done
          GOOS=freebsd go build ./...
      # The installer tests download NSIS on Windows; keeping it in the cache
      # spares them the download, and the hosts it comes from.
      - name: Restore NSIS
        id: nsis
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('cmd/mygo/nsis.go') }}
      - run: go test ./...
      - name: Save NSIS
        if: always() && runner.os == 'Windows' && steps.nsis.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: ${{ steps.nsis.outputs.cache-primary-key }}
      - run: bun run test
      - run: bun run typecheck
      - name: GUI tests
        if: runner.os != 'Linux'
        env:
          MYGO_E2E: 1
        run: go test ./internal/e2e
      - name: GUI tests
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: xvfb-run -a dbus-run-session -- go test ./internal/e2e
      # The GUI tests again with Chromium (linux.cef), from the cache that
      # the CLI downloads CEF into.
      - name: Restore CEF
        id: cef
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/mygo/cef-*
          key: cef-${{ runner.arch }}-${{ hashFiles('cmd/mygo/cef.go') }}
      - name: Bundle CEF
        if: runner.os == 'Linux'
        env:
          MYGO_CEF_OUT: ${{ runner.temp }}
        run: go test -count=1 -run '^TestCEFBundle$' ./cmd/mygo
      - name: Save CEF
        if: always() && runner.os == 'Linux' && steps.cef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/mygo/cef-*
          key: ${{ steps.cef.outputs.cache-primary-key }}
      - name: GUI tests with CEF
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          MYGO_CEF_DIR: ${{ runner.temp }}/cef
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: xvfb-run -a dbus-run-session -- go test -count=1 ./internal/e2e
